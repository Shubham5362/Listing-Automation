name: Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Hide provider metadata from chat UI
        working-directory: frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/AISellerAgentWorkspace.tsx')
          s = p.read_text()
          s = s.replace("<PanelHead title=\"Ask your seller agent\" sub={`Multilingual · ${provider}`} />", "<PanelHead title=\"Ask your seller agent\" sub=\"Multilingual AI assistant\" />")
          s = s.replace("<b>{item.role === 'user' ? 'You' : 'AI Seller Agent'}</b><p>{item.text}</p>{item.provider && <small>via {item.provider}{item.model ? ` · ${item.model}` : ''}</small>}{item.fallbackReason && <small className=\"fallback-reason\">AI diagnostic: {item.fallbackReason}</small>}", "<b>{item.role === 'user' ? 'You' : 'AI Seller Agent'}</b><p>{item.text}</p>")
          p.write_text(s)
          PY

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
