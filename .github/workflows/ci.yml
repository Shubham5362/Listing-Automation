name: CI

# Phase policy: CI runs only for the phase PR lifecycle, never for ordinary pushes to main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy-and-ci:
    name: Policy & CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check for forbidden secret files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              .env.example) ;;
              .env|.env.*|*.pem|*.key|id_rsa|id_ed25519|*/id_rsa|*/id_ed25519) echo "$file"; echo "Forbidden credential/secret file detected in the repository."; exit 1 ;;
            esac
          done < <(git ls-files)
      - name: Detect project type
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$([[ -f frontend/package.json || -f package.json ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([[ -f pyproject.toml || -f requirements.txt || -f setup.py || -f backend/pyproject.toml || -f backend/requirements.txt ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "go=$([[ -f go.mod ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rust=$([[ -f Cargo.toml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "compose=$([[ -f docker-compose.yml || -f compose.yml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install Node dependencies
        if: steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd frontend 2>/dev/null || true
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
      - name: Node validation
        if: steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd frontend 2>/dev/null || true
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then npm run lint; fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then npm run test --if-present; fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then npm run build; fi
      - name: Setup Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Python validation
        if: steps.detect.outputs.python == 'true'
        env:
          RATE_LIMIT_PER_MINUTE: 1000
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f backend/requirements.txt ]]; then python -m pip install -r backend/requirements.txt; fi
          if [[ -f backend/pyproject.toml ]]; then python -m pip install ./backend; fi
          python -m compileall -q backend
          if [[ -d backend/tests ]]; then (cd backend && python -m pytest -q --cov=app --cov-report=term-missing); fi
      - name: Docker Compose validation
        if: steps.detect.outputs.compose == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD=ci-only-password
          export SECRET_KEY=ci-only-secret
          export CREDENTIALS_ENCRYPTION_KEY=ZHVtbXkta2V5LWZvci1jaS1vbmse
          docker compose config --quiet
      - name: Setup Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
      - name: Go validation
        if: steps.detect.outputs.go == 'true'
        shell: bash
        run: go test ./... && go vet ./...
      - name: Rust validation
        if: steps.detect.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable && cargo test --all-targets --all-features
      - name: Final CI gate
        run: echo "All applicable policy and CI checks completed successfully."