name: No-Card Worker Pulse

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seller-hub-worker
  cancel-in-progress: false

jobs:
  worker:
    name: Process background jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Process queued jobs
        working-directory: backend
        env:
          ENVIRONMENT: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          WORKER_POLL_INTERVAL_SECONDS: "2"
          WORKER_BATCH_SIZE: "5"
          WORKER_MAX_ATTEMPTS: "3"
          WORKER_RETRY_BACKOFF_SECONDS: "10"
          WORKER_STALE_AFTER_SECONDS: "1800"
        run: |
          python - <<'PY'
          import time
          from app.worker import BackgroundWorker

          worker = BackgroundWorker(worker_id="github-actions-pulse")
          deadline = time.monotonic() + 240
          while time.monotonic() < deadline:
              processed = worker.run_once()
              if not processed:
                  time.sleep(5)
          PY
