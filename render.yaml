services:
  # Free Render Key Value (Valkey) for cache/job-queue coordination.
  - type: keyvalue
    name: seller-hub-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: seller-hub-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: REDIS_URL
        fromService:
          name: seller-hub-redis
          type: keyvalue
          property: connectionString
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "2"
      - key: WORKER_BATCH_SIZE
        value: "5"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: WORKER_RETRY_BACKOFF_SECONDS
        value: "10"
      - key: WORKER_STALE_AFTER_SECONDS
        value: "1800"
      - key: WORKER_CONCURRENCY
        value: "1"

# Note: Render Background Workers are intentionally not provisioned here because
# they are not available on the Free plan. The worker process will be handled
# separately through the project's zero-cost scheduled worker strategy.
