services:
  # Reuse the existing Free Render Key Value instance in this workspace.
  - type: keyvalue
    name: apna-mandla-redis
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: seller-hub-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: REDIS_URL
        fromService:
          name: apna-mandla-redis
          type: keyvalue
          property: connectionString
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "2"
      - key: WORKER_BATCH_SIZE
        value: "5"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: WORKER_RETRY_BACKOFF_SECONDS
        value: "10"
      - key: WORKER_STALE_AFTER_SECONDS
        value: "1800"
      - key: WORKER_CONCURRENCY
        value: "1"

# Render Background Workers are not provisioned here because they are not
# available on the Free plan. The worker process uses the zero-cost scheduled
# GitHub Actions worker strategy instead.
