services:
  - type: web
    name: seller-hub-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "2"
      - key: WORKER_BATCH_SIZE
        value: "5"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: WORKER_RETRY_BACKOFF_SECONDS
        value: "10"
      - key: WORKER_STALE_AFTER_SECONDS
        value: "1800"
      - key: WORKER_CONCURRENCY
        value: "1"

  # Continuous worker service. Render does not offer a free plan for background
  # workers; keep this definition ready for the first paid compute upgrade.
  - type: worker
    name: seller-hub-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: python -m app.worker
    maxShutdownDelaySeconds: 300
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "2"
      - key: WORKER_BATCH_SIZE
        value: "5"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: WORKER_RETRY_BACKOFF_SECONDS
        value: "10"
      - key: WORKER_STALE_AFTER_SECONDS
        value: "1800"
      - key: WORKER_CONCURRENCY
        value: "1"
