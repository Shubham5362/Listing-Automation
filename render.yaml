services:
  # Reuse the existing Free Render Key Value instance in this workspace.
  - type: keyvalue
    name: apna-mandla-redis
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: seller-hub-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: PERSONAL_SELLER_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_RETRY_ATTEMPTS
        value: "3"
      - key: LLM_RETRY_BACKOFF_SECONDS
        value: "1.5"
      - key: LLM_PRIMARY_PROVIDER
        value: gemini
      - key: AI_ENABLED
        value: "true"
      - key: AI_SCOPE_GUARD_ENABLED
        value: "true"
      - key: AI_REQUESTS_PER_MINUTE
        value: "10"
      - key: AI_REQUESTS_PER_HOUR
        value: "50"
      - key: AI_MAX_INPUT_CHARS
        value: "4000"
      - key: AI_MAX_TOOL_CALLS
        value: "3"
      - key: AI_MAX_WORKFLOW_STEPS
        value: "5"
      - key: MARKETPLACE_SYNC_INTERVAL_MINUTES
        value: "30"
      - key: AMAZON_SELLER_ID
        sync: false
      - key: AMAZON_LWA_CLIENT_ID
        sync: false
      - key: AMAZON_LWA_CLIENT_SECRET
        sync: false
      - key: AMAZON_LWA_REFRESH_TOKEN
        sync: false
      - key: AMAZON_AWS_ACCESS_KEY_ID
        sync: false
      - key: AMAZON_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AMAZON_AWS_SESSION_TOKEN
        sync: false
      - key: FLIPKART_SELLER_ID
        sync: false
      - key: FLIPKART_APP_ID
        sync: false
      - key: FLIPKART_APP_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          name: apna-mandla-redis
          type: keyvalue
          property: connectionString
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "2"
      - key: WORKER_BATCH_SIZE
        value: "5"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: WORKER_RETRY_BACKOFF_SECONDS
        value: "10"
      - key: WORKER_STALE_AFTER_SECONDS
        value: "1800"
      - key: WORKER_CONCURRENCY
        value: "1"

# Render Background Workers are not provisioned here because they are not
# available on the Free plan. The worker process uses the zero-cost scheduled
# GitHub Actions worker strategy instead.
